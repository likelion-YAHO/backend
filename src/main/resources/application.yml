spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hackathon}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://*.netlify.app,http://localhost:3000,http://localhost:5173}
  jwt:
    # HS256용 시크릿 (기본값)
    secret: ${JWT_SECRET:likelion-hackathon-jwt-secret-key-must-be-at-least-32-bytes}
    # access token 유효 기간(1시간)
    access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
    # refresh token 유효 기간(14일)
    refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
