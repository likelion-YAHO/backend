spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hackathon}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://*.netlify.app,http://localhost:3000,http://localhost:5173}
  jwt:
    # HS256용 시크릿 (기본값)
    secret: ${JWT_SECRET:likelion-hackathon-jwt-secret-key-must-be-at-least-32-bytes}
    # access token 유효 기간(1시간)
    access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
    # refresh token 유효 기간(14일)
    refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}
  storage:
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR:./uploads}
      base-url: ${APP_STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
  ai:
    # true면 OpenAI Vision 사용, false면 Mock
    enabled: ${APP_AI_ENABLED:true}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_VISION_MODEL:gpt-4.1-mini}
    detail: ${OPENAI_VISION_DETAIL:low}
    timeout-ms: ${OPENAI_TIMEOUT_MS:60000}
    # 시안 이미지 생성 (Images edits API)
    design-image-enabled: ${OPENAI_DESIGN_IMAGE_ENABLED:true}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
    image-quality: ${OPENAI_IMAGE_QUALITY:low}
    image-size: ${OPENAI_IMAGE_SIZE:1024x1024}
    image-timeout-ms: ${OPENAI_IMAGE_TIMEOUT_MS:120000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
